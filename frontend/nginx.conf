server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA 兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 实时协作 WebSocket：必须单独一段做协议升级。
    # 走下面 /api/ 的普通反代不会转发 Upgrade 头，握手会退化成普通 GET 被后端拒绝，
    # 表现就是「团队画布打开后一直显示协作未连接」。
    location /api/collab/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：读写超时给足，否则空闲画布会被代理掐断后反复重连
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 反代后端 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 支持
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # 用户图片（生成结果 / 上传素材）。
    #
    # 两个关键点，缺一个就会「放入画布等半天」：
    # 1. **直接由 nginx 读盘**（compose 把后端数据卷只读挂到 /srv/cs-data），
    #    不再每个字节都穿过 Python 的 StaticFiles；sendfile 走零拷贝，快一个量级。
    # 2. **长缓存**。文件名是 UUID，内容永不覆盖，可以放心 immutable——
    #    否则每次刷新画布都要把每张 2MB 的 PNG 重新下一遍。
    # 读不到时（卷没挂上 / 老路径）自动回落到后端反代，保证不会 404。
    location /static/ {
        alias /srv/cs-data/storage/;
        # 用 error_page 而不是 try_files：alias + try_files 在部分 nginx 版本上
        # 会把路径拼错，error_page 内部跳转没有这个坑。
        error_page 404 = @static_backend;
        # expires 自带 add_header，会额外吐一个 Cache-Control，所以只写 add_header
        add_header Cache-Control "public, max-age=31536000, immutable";
        etag on;
        access_log off;
    }

    location @static_backend {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 让后端也知道这是同源直连，不要被当成跨域
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
