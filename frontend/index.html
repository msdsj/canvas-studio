<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Canvas Studio · AI 无限画布创作平台" />
    <title>Canvas Studio</title>
    <script>
      // 首屏主题防闪：在渲染前根据 localStorage / 系统偏好设置 data-theme
      (function () {
        try {
          var stored = localStorage.getItem('cs.theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : null
          if (!mode) {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', mode)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
