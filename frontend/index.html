<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="zleap Canvas · AI 设计 Agent 与无限画布" />
    <meta name="theme-color" content="#f4f1e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0a07" media="(prefers-color-scheme: dark)" />
    <title>zleap Canvas</title>
    <script>
      // 首屏主题防闪：在渲染前根据 localStorage / 系统偏好设置 data-theme
      (function () {
        try {
          var stored = localStorage.getItem('cs.theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : 'light'
          // 「跟随系统」要在首帧就解析成实际明暗，否则暗色系统用户会先闪一下亮色
          if (stored === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', mode)
          document.documentElement.style.colorScheme = mode
          var lang = localStorage.getItem('cs.language')
          if (lang) document.documentElement.setAttribute('lang', lang)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
