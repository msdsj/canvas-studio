<!-- MSDSJ · 横排组合：MSDSJ Mark + MSDSJ
     说明：图形与 logo-mark.svg 同一套几何；文字用 <text> 渲染，
           字体栈 Plus Jakarta Sans → PingFang SC → 系统 sans。
           ⚠ 作为 <img src> 引用时无法加载 webfont，会退化到系统无衬线。 -->
<svg viewBox="0 0 196 48" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="MSDSJ">
  <g transform="translate(4 8) scale(0.66)">
    <path d="M8 40 L14.6 11 H19.1 L12.6 40 Z" fill="currentColor" opacity="0.72"/>
    <path d="M18.8 11 L23.4 27.6 L27.6 11 H32.2 L26.3 40 H21 Z" fill="currentColor" opacity="0.5"/>
    <path d="M30.8 11 H42 L33.4 40 H22.6 Z" fill="#35B3C9"/>
  </g>
  <text x="44" y="24" fill="currentColor" dominant-baseline="central"
        font-family="'Plus Jakarta Sans','PingFang SC','Noto Sans SC','Hiragino Sans GB',-apple-system,'Segoe UI',sans-serif"
        font-size="20" font-weight="700" letter-spacing="0.4">MSDSJ</text>
</svg>
