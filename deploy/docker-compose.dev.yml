services:
  backend:
    build:
      context: ../backend
    environment:
      CS_DATABASE_URL: sqlite+aiosqlite:///./data/canvas_studio.db
      CS_STORAGE_DIR: ./data/storage
      CS_FRONTEND_BASE_URL: http://localhost:5173
      CS_CORS_ORIGINS: http://localhost:5173
      CS_GATEWAY_BASE_URL: http://gateway:8100
      CS_GATEWAY_INTERNAL_TOKEN: ${CS_GATEWAY_INTERNAL_TOKEN:?Set CS_GATEWAY_INTERNAL_TOKEN in deploy/.env}
      CS_DEMO_MODE: off
      CS_IMAGE_CONCURRENCY: ${CS_IMAGE_CONCURRENCY:-4}
      CS_IMAGE_QUEUE_MAX: ${CS_IMAGE_QUEUE_MAX:-200}
      CS_MAX_ACTIVE_TASKS_PER_USER: ${CS_MAX_ACTIVE_TASKS_PER_USER:-12}
      TEXT_API_BASE_URL: ${TEXT_API_BASE_URL:-}
      TEXT_API_KEY: ${TEXT_API_KEY:-}
      TEXT_MODEL: ${TEXT_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - ../backend:/app
      - backend_data_dev:/app/data
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - gateway

  gateway:
    build:
      context: ../gateway
    environment:
      CS_GATEWAY_INTERNAL_TOKEN: ${CS_GATEWAY_INTERNAL_TOKEN:?Set CS_GATEWAY_INTERNAL_TOKEN in deploy/.env}
      CS_DEMO_MODE: off
      TEXT_API_BASE_URL: ${TEXT_API_BASE_URL:-}
      TEXT_API_KEY: ${TEXT_API_KEY:-}
      TEXT_MODEL: ${TEXT_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - ../gateway:/app
      - gateway_data_dev:/app/data
    ports:
      - "8100:8100"
    # Keep one worker so the local account pool remains coherent.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload

volumes:
  backend_data_dev:
  gateway_data_dev:
