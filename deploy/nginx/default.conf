# 独立 nginx 反代（若不用 frontend 内置 nginx）
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /static/ {
        proxy_pass http://backend:8000;
    }
}
