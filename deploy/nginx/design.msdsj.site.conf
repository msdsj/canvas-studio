# canvas-studio（MSDSJ AI画布）
# 反代到 Docker 内的 frontend(127.0.0.1:8801)，它内部再转 backend/gateway。
# 证书：Let's Encrypt，DNS-01 验证（本机 80 端口被云厂商封锁，不可用 HTTP-01）
# 更新：2026-10-25

map $http_upgrade $connection_upgrade_cs {
    default upgrade;
    ''      close;
}

# HTTP：仅保留 ACME 校验，其余全部跳 HTTPS
server {
    listen 80;
    server_name design.msdsj.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name design.msdsj.site;

    ssl_certificate     /etc/letsencrypt/live/design.msdsj.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/design.msdsj.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传素材/画布导出
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8801;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 协作画布 WebSocket：缺这段会一直显示「协作未连接」
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_cs;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
