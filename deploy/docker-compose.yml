services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    environment:
      CS_DATABASE_URL: sqlite+aiosqlite:///./data/canvas_studio.db
      CS_STORAGE_DIR: ./data/storage
      CS_STORAGE_PUBLIC_BASE: http://localhost/static
      CS_FRONTEND_BASE_URL: http://localhost
      CS_CORS_ORIGINS: http://localhost
      CS_GATEWAY_BASE_URL: http://gateway:8100
      CS_GATEWAY_INTERNAL_TOKEN: ${CS_GATEWAY_INTERNAL_TOKEN:-dev-internal-token}
      CS_SECRET_KEY: ${CS_SECRET_KEY:-dev-change-me}
      CS_DEFAULT_ADMIN_EMAIL: ${CS_DEFAULT_ADMIN_EMAIL:-admin@canvas.studio}
      CS_DEFAULT_ADMIN_PASSWORD: ${CS_DEFAULT_ADMIN_PASSWORD:-Admin@12345}
      CS_DEMO_MODE: ${CS_DEMO_MODE:-off}
      TEXT_API_BASE_URL: ${TEXT_API_BASE_URL:-}
      TEXT_API_KEY: ${TEXT_API_KEY:-}
      TEXT_MODEL: ${TEXT_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,gateway}
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    build:
      context: ../gateway
    environment:
      CS_GATEWAY_INTERNAL_TOKEN: ${CS_GATEWAY_INTERNAL_TOKEN:-dev-internal-token}
      CS_DEMO_MODE: ${CS_DEMO_MODE:-off}
      TEXT_API_BASE_URL: ${TEXT_API_BASE_URL:-}
      TEXT_API_KEY: ${TEXT_API_KEY:-}
      TEXT_MODEL: ${TEXT_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,gateway}
    ports:
      - "8100:8100"
    volumes:
      - gateway_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
  gateway_data:
